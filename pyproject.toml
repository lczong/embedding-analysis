[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-analysis"
version = "0.1.0"
description = "Shared CAZy and peptidase embedding analysis"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "joblib", "openTSNE", "umap-learn"]

[tool.setuptools.packages.find]
where = ["src"]
